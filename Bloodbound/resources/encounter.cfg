[story]
arena="THE THRONE OF THE ECLIPSE"
opening=[{"art":"clan","line":"A clan once kept watch over the passage between life and death.","duration":7.1,"track":"prologue"},{"art":"blade","line":"They entrusted that passage to Honjō Masamune.","duration":5.4},{"art":"massacre","line":"The Hollow Sovereign came for the blade. The courtyard burned.","duration":8.7,"track":"clan_massacre","cue":"death"},{"art":"massacre","line":"Under the ashes, one heir still breathed.","duration":6.5},{"art":"heir","line":"I carried their blade out of the ruins.","duration":5.6},{"art":"heir","line":"Now I carry it home.","duration":5.6}]
memorial=[{"art":"memory","line":"They did not die for a king. They died for an oath.","duration":8.5,"track":"clan_memorial"},{"art":"blade","line":"The blade draws the soul back. Let it draw yours by choice.","duration":8.5},{"art":"awakening","line":"Let Honjō Masamune carry the grief you cannot hold.","duration":8.5},{"art":"heir","line":"Carry the echo to the gate below.","duration":8.5}]
ending=[{"art":"defeat","line":"The Sovereign's shadow fell from the throne.","duration":7.3,"track":"epilogue"},{"art":"memory","line":"At dawn, the names of the fallen returned to the shrine.","duration":7.8},{"art":"ending","line":"I lowered Honjō Masamune. The blade was finally still.","duration":9.9,"animation":"victory"}]
afterlife_voice="Your story has not ended."
final_voice="Finish what we began."
challenge="Your bloodline ends here."
departure="Another bloodline erased."
reunion="You died beneath my blade."
reply="And yet here I stand."
awakening_reaction="Honjō Masamune calls you back."
doom="THE SOVEREIGN'S DECREE"
phase_two_line="Your blade remembers what I erased."
phase_three_line="Then remember this."
warden_intro="You will not cross these bells alive."
spirit_intro="Show me what remains of your oath."
guardian_intro="Only the dead may walk beyond this gate."
rival_intro="Let the steel remember us."
victory="THE LAST OATH HAS BEEN FULFILLED."

