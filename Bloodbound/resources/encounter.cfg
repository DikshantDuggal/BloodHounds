[story]
arena="THE ECLIPSE FORTRESS"
opening=[{"art":"clan","line":"A clan once kept watch over the passage between life and death.","duration":7.1,"track":"prologue"},{"art":"blade","line":"They entrusted that passage to Ketsumei.","duration":5.4},{"art":"massacre","line":"The Hollow Sovereign came for the blade. The courtyard burned.","duration":8.7,"track":"clan_massacre","cue":"death"},{"art":"massacre","line":"Under the ashes, one heir still breathed.","duration":6.5},{"art":"heir","line":"I carried their blade out of the ruins.","duration":5.6},{"art":"heir","line":"Now I carry it home.","duration":5.6}]
memorial=[{"art":"memory","line":"They did not die for a king. They died for an oath.","duration":8.5,"track":"clan_memorial"},{"art":"blade","line":"The blade draws the soul back. Let it draw yours by choice.","duration":8.5},{"art":"awakening","line":"Let Ketsumei carry the grief you cannot hold.","duration":8.5},{"art":"heir","line":"Carry the echo to the gate below.","duration":8.5}]
ending=[{"art":"defeat","line":"The Overlord's fire died beneath the eclipse.","duration":3.6,"track":"epilogue"},{"art":"memory","line":"At dawn, the names of the fallen returned to the shrine.","duration":4.1},{"art":"ending","line":"I lowered Ketsumei. The blade was finally still.","duration":5.0,"animation":"victory"}]
afterlife_voice="Your story has not ended."
final_voice="Finish what we began."
